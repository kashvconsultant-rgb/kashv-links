<style>
  /* Dark is the brand's native ground: every existing KashV poster is navy-on-cream, so the
     bare :root below carries the dark palette as the default, and the cream (their own
     secondary brand colour) becomes the explicit light variant further down. */
  :root {
    --bg: #12283d;
    --bg-elevated: #1c3a5c;
    --ink: #f7f2e7;
    --ink-muted: #93a5bc;
    --rule: rgba(247, 242, 231, 0.14);
    --accent: #ff6b47;
    --accent-ink: #12283d;

    --consulting: #274a76;
    --contentpilot: #1a5c4c;
    --contentpilot-ink: #eef6f1;
    --kooli: #7c5622;
    --kooli-ink: #fbf1e2;
    --club: #5c2a52;
    --club-ink: #f9eef5;
    --tuition: #2f5233;
    --tuition-ink: #eef6ee;
    --gold: #8a6416;
    --gold-ink: #fdf3dc;

    --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Rounded", "Segoe UI", system-ui, sans-serif;
    --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f2e7;
      --bg-elevated: #ffffff;
      --ink: #12283d;
      --ink-muted: #5c6c81;
      --rule: rgba(18, 40, 61, 0.13);
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f2e7; --bg-elevated: #ffffff; --ink: #12283d; --ink-muted: #5c6c81; --rule: rgba(18, 40, 61, 0.13);
  }
  :root[data-theme="dark"] {
    --bg: #12283d; --bg-elevated: #1c3a5c; --ink: #f7f2e7; --ink-muted: #93a5bc; --rule: rgba(247, 242, 231, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1, h2, h3 {
    font-family: var(--font-serif);
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
  }
  .product-voice { font-family: var(--font-display); font-weight: 800; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 56px); }

  /* ---------- nav ---------- */
  .site-nav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 72px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand svg { width: 28px; height: 28px; flex: none; }
  .brand-word { font-family: var(--font-serif); font-weight: 700; font-size: 1.08rem; letter-spacing: -0.01em; white-space: nowrap; }
  .nav-links { display: flex; align-items: center; gap: clamp(16px, 3vw, 28px); list-style: none; margin: 0; padding: 0; }
  .nav-links a { text-decoration: none; font-size: 0.9rem; font-weight: 600; color: var(--ink-muted); transition: color 0.15s ease; }
  .nav-links a:hover { color: var(--ink); }
  .nav-ctas { display: flex; align-items: center; gap: 10px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 999px;
    font-family: var(--font-body); font-weight: 700; font-size: 0.9rem;
    text-decoration: none; cursor: pointer; border: none; white-space: nowrap;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); padding: 11px 22px; }
  .btn-primary:hover { box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 10px 20px; }
  .btn-ghost:hover { border-color: var(--ink-muted); }
  .btn-sm { padding: 8px 16px; font-size: 0.82rem; }

  /* ---------- hero ---------- */
  .hero { position: relative; padding: clamp(52px, 9vw, 100px) 0 clamp(40px, 6vw, 64px); overflow: clip; }
  .hero-mark { position: absolute; right: clamp(-60px, 1vw, 0px); top: 10%; width: clamp(200px, 22vw, 320px); opacity: 0.85; pointer-events: none; }
  .hero-content { max-width: 700px; position: relative; }
  .hero .eyebrow { margin-bottom: 18px; }
  .hero h1 { font-size: clamp(2.1rem, 4.4vw, 3.3rem); line-height: 1.1; letter-spacing: -0.01em; }
  .hero p.lede { margin: 22px 0 0; max-width: 56ch; font-size: 1.08rem; color: var(--ink-muted); }
  .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 32px; }

  .k-arrow-stroke { stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw-arrow 1.1s 0.35s cubic-bezier(0.65,0,0.35,1) forwards; }
  @keyframes draw-arrow { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .k-arrow-stroke { animation: none; stroke-dashoffset: 0; } }

  /* ---------- section shell (applied by JS only to populated sections, so an
     unrendered/hidden section never reserves empty space) ---------- */
  .section-block { padding: clamp(56px, 8vw, 96px) 0; }
  .section-block.tight { padding-top: 0; }
  .trust-bar.section-block { padding: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .section-head { max-width: 640px; margin-bottom: clamp(32px, 5vw, 48px); }
  .section-head h2 { font-size: clamp(1.6rem, 3vw, 2.15rem); margin-top: 10px; }
  .section-head p { margin: 10px 0 0; color: var(--ink-muted); max-width: 52ch; }

  /* trust bar */
  .trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); }
  .trust-item { background: var(--bg); padding: 22px 20px; text-align: center; }
  .trust-item strong { display: block; font-family: var(--font-serif); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .trust-item span { display: block; margin-top: 4px; font-size: 0.78rem; color: var(--ink-muted); }
  @media (max-width: 700px) { .trust-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- services ---------- */
  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .service-card { border: 1px solid var(--rule); border-radius: 18px; padding: 28px 26px; background: var(--bg-elevated); display: flex; flex-direction: column; gap: 14px; }
  .service-card .num { font-family: var(--font-serif); font-size: 0.85rem; color: var(--accent); font-weight: 700; }
  .service-card h3 { font-size: 1.28rem; }
  .service-card p { margin: 0; color: var(--ink-muted); font-size: 0.94rem; }
  .service-card ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .service-card li { display: flex; gap: 8px; font-size: 0.86rem; color: var(--ink-muted); }
  .service-card li::before { content: "→"; color: var(--accent); flex: none; }
  @media (max-width: 860px) { .services-grid { grid-template-columns: 1fr; } }

  /* ---------- proof strip (software) ---------- */
  .proof.section-block { border-top: 1px solid var(--rule); }
  .proof-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .proof-card { border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; min-height: 150px; }
  .proof-card[data-tone="contentpilot"] { background: var(--contentpilot); color: var(--contentpilot-ink); }
  .proof-card[data-tone="kooli"] { background: var(--kooli); color: var(--kooli-ink); }
  .proof-card[data-tone="club"] { background: var(--club); color: var(--club-ink); }
  .proof-card[data-tone="tuition"] { background: var(--tuition); color: var(--tuition-ink); }
  .proof-card[data-tone="gold"] { background: var(--gold); color: var(--gold-ink); }
  .proof-card .product-voice { font-size: 1.05rem; }
  .proof-card p { margin: 0; font-size: 0.82rem; opacity: 0.88; }
  .proof-card .go { margin-top: auto; font-size: 0.78rem; font-weight: 700; opacity: 0.9; }
  .section-link { display: inline-block; margin-top: 24px; font-weight: 700; font-size: 0.94rem; color: var(--accent); text-decoration: none; }
  .section-link:hover { text-decoration: underline; }

  /* ---------- testimonials ---------- */
  .sample-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); border: 1px dashed var(--rule); border-radius: 999px; padding: 3px 10px; margin-top: 10px; }
  .testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .testi-card { border-radius: 16px; background: var(--bg-elevated); border: 1px solid var(--rule); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .testi-card blockquote { margin: 0; font-family: var(--font-serif); font-size: 1.08rem; line-height: 1.45; }
  .testi-card footer { font-size: 0.82rem; color: var(--ink-muted); font-style: normal; }
  @media (max-width: 860px) { .testi-grid { grid-template-columns: 1fr; } }

  /* ---------- faq ---------- */
  .faq.section-block { border-top: 1px solid var(--rule); }
  .faq-list { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
  .faq-item { border: 1px solid var(--rule); border-radius: 14px; background: var(--bg-elevated); overflow: hidden; }
  .faq-item summary { cursor: pointer; list-style: none; padding: 18px 22px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 0.98rem; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary .plus { color: var(--accent); font-family: var(--font-serif); font-size: 1.2rem; flex: none; }
  .faq-item[open] summary .plus { transform: rotate(45deg); }
  .faq-item p { margin: 0; padding: 0 22px 20px; color: var(--ink-muted); font-size: 0.92rem; max-width: 62ch; }

  /* ---------- final cta ---------- */
  .final-cta.section-block { padding-top: 0; }
  .final-cta-inner { padding: clamp(36px, 6vw, 56px); border-radius: 24px; background: var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .final-cta-inner h2 { color: var(--accent-ink); font-size: clamp(1.5rem, 3vw, 2rem); max-width: 20ch; }
  .final-cta-inner .btn-ghost { background: var(--accent-ink); color: var(--accent); border: none; }

  /* ---------- footer ---------- */
  footer.site-footer { border-top: 1px solid var(--rule); padding: 48px 0 calc(48px + env(safe-area-inset-bottom, 0px)); }
  .footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 32px; }
  .footer-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .footer-brand svg { width: 22px; height: 22px; }
  .footer-brand span { font-family: var(--font-serif); font-weight: 700; font-size: 1rem; }
  .footer-col h4 { font-family: var(--font-body); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 14px; }
  .footer-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .footer-col a, .footer-col address { text-decoration: none; font-size: 0.88rem; color: var(--ink-muted); font-style: normal; font-weight: 600; }
  .footer-col a:hover { color: var(--ink); }
  .footer-note { color: var(--ink-muted); font-size: 0.88rem; max-width: 34ch; margin-top: 12px; }
  .footer-meta { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 0.8rem; color: var(--ink-muted); }
  @media (max-width: 860px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 500px) { .footer-grid { grid-template-columns: 1fr; } }

  /* ---------- mobile sticky cta ---------- */
  .mobile-cta {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); border-top: 1px solid var(--rule); gap: 10px;
  }
  .mobile-cta .btn { flex: 1; justify-content: center; }
  @media (max-width: 640px) { .mobile-cta { display: flex; } body { padding-bottom: 64px; } .nav-ctas { display: none; } }

  @media (max-width: 860px) { .nav-links { display: none; } }

  .k-logo-svg { width: 100%; height: 100%; }

  /* ---------- lead form modal ---------- */
  .lead-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in srgb, #000 62%, transparent);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .lead-overlay[hidden] { display: none; }
  .lead-modal {
    width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
    background: var(--bg-elevated); color: var(--ink);
    border-radius: 20px; border: 1px solid var(--rule);
    padding: clamp(24px, 5vw, 32px);
    position: relative;
  }
  .lead-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--rule);
    background: transparent; color: var(--ink); font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .lead-close:hover { border-color: var(--ink-muted); }
  .lead-modal h2 { font-size: 1.4rem; padding-right: 30px; }
  .lead-modal .lede { margin: 8px 0 0; color: var(--ink-muted); font-size: 0.92rem; }
  .lead-form { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .lead-field { display: flex; flex-direction: column; gap: 6px; }
  .lead-field label { font-size: 0.82rem; font-weight: 700; color: var(--ink-muted); }
  .lead-field input, .lead-field select {
    font: inherit; font-size: 0.96rem; color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 10px; padding: 11px 13px;
  }
  .lead-field input:focus-visible, .lead-field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lead-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .lead-submit { margin-top: 4px; width: 100%; justify-content: center; }
  .lead-submit[disabled] { opacity: 0.6; cursor: default; transform: none; }
  .lead-status { margin: 0; font-size: 0.88rem; min-height: 1.2em; }
  .lead-status[data-state="ok"] { color: var(--accent); }
  .lead-status[data-state="error"] { color: #ff8a75; }
</style>
</head>

        <ul id="footer-contact"></ul>
      </div>
      <div class="footer-col">
        <h4>Also built by us</h4>
        <ul id="footer-sister"></ul>
      </div>
      <div class="footer-col">
        <h4>Follow</h4>
        <ul id="footer-social"></ul>
      </div>
    </div>
    <div class="footer-meta">
      <span>© 2026 KashV Consultancy</span>
      <span>Coimbatore, Tamil Nadu, India</span>
    </div>
  </div>
</footer>

<div class="mobile-cta" id="mobile-cta"></div>

<div class="lead-overlay" id="lead-overlay" hidden>
  <div class="lead-modal" role="dialog" aria-modal="true" aria-labelledby="lead-form-heading">
    <button type="button" class="lead-close" id="lead-close" aria-label="Close">✕</button>
    <h2 id="lead-form-heading"></h2>
    <p class="lede" id="lead-form-sub"></p>
    <form class="lead-form" id="lead-form" novalidate>
      <div class="lead-field">
        <label id="lead-name-label" for="lead-name"></label>
        <input type="text" id="lead-name" name="name" required autocomplete="name">
      </div>
      <div class="lead-field">
        <label id="lead-company-label" for="lead-company"></label>
        <input type="text" id="lead-company" name="company" autocomplete="organization">
      </div>
      <div class="lead-field">
        <label id="lead-phone-label" for="lead-phone"></label>
        <input type="tel" id="lead-phone" name="phone" required autocomplete="tel">
      </div>
      <div class="lead-field">
        <label id="lead-service-label" for="lead-service"></label>
        <select id="lead-service" name="service" required></select>
      </div>
      <div class="lead-hp" aria-hidden="true">
        <label for="lead-website">Website</label>
        <input type="text" id="lead-website" name="website" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary lead-submit" id="lead-submit"></button>
      <p class="lead-status" id="lead-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="/chatbot.js" defer></script>
<script>
(function () {
  // Every visible bit of copy on this page comes from content.json, fetched at
  // load time. Editing wording is editing that JSON file — never this markup —
  // then redeploying (`vercel deploy --prod --yes`). Each optional section has a
  // "visible" flag in content.json; setting it to false skips that section's
  // builder entirely below, so it's never inserted into the DOM (no empty gap),
  // and whatever comes next simply follows immediately.

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var key in (attrs || {})) {
      if (key === "text") node.textContent = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function (child) {
      if (child) node.appendChild(child);
    });
    return node;
  }

  var API_BASE = "https://kashv-links.vercel.app/api/leads";

  function buildLeadForm(content) {
    var d = content.leadForm;
    if (!d) return;

    document.getElementById("lead-form-heading").textContent = d.heading;
    document.getElementById("lead-form-sub").textContent = d.subheading;
    document.getElementById("lead-name-label").textContent = d.fields.name;
    document.getElementById("lead-company-label").textContent = d.fields.company;
    document.getElementById("lead-phone-label").textContent = d.fields.phone;
    document.getElementById("lead-service-label").textContent = d.serviceLabel;
    document.getElementById("lead-submit").textContent = d.submitLabel;

    var select = document.getElementById("lead-service");
    select.appendChild(el("option", { value: "", text: d.servicePlaceholder }));
    d.serviceOptions.forEach(function (opt) {
      select.appendChild(el("option", { value: opt.value, text: opt.label }));
    });

    var overlay = document.getElementById("lead-overlay");
    var form = document.getElementById("lead-form");
    var status = document.getElementById("lead-status");
    var submitBtn = document.getElementById("lead-submit");
    var lastFocused = null;

    function openLeadForm(serviceValue) {
      lastFocused = document.activeElement;
      status.textContent = "";
      status.removeAttribute("data-state");
      form.reset();
      if (serviceValue) select.value = serviceValue;
      overlay.hidden = false;
      document.getElementById("lead-name").focus();
      document.addEventListener("keydown", onKeydown);
    }

    function closeLeadForm() {
      overlay.hidden = true;
      document.removeEventListener("keydown", onKeydown);
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    function onKeydown(e) {
      if (e.key === "Escape") closeLeadForm();
    }

    document.addEventListener("click", function (e) {
      var trigger = e.target.closest("[data-open-form]");
      if (trigger) {
        e.preventDefault();
        openLeadForm(trigger.getAttribute("data-open-form") || null);
      }
    });

    document.getElementById("lead-close").addEventListener("click", closeLeadForm);
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeLeadForm();
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var payload = {
        name: document.getElementById("lead-name").value.trim(),
        company: document.getElementById("lead-company").value.trim(),
        phone: document.getElementById("lead-phone").value.trim(),
        service: select.value,
        website: document.getElementById("lead-website").value
      };

      if (!payload.name || !payload.phone || !payload.service) {
        status.textContent = d.errorMessage;
        status.setAttribute("data-state", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = d.submittingLabel;
      status.textContent = "";
      status.removeAttribute("data-state");

      fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(function (res) {
          if (!res.ok) throw new Error("Request failed");
          return res.json();
        })
        .then(function () {
          status.textContent = d.successMessage;
          status.setAttribute("data-state", "ok");
          form.reset();
          setTimeout(closeLeadForm, 1800);
        })
        .catch(function () {
          status.textContent = d.errorMessage;
          status.setAttribute("data-state", "error");
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = d.submitLabel;
        });
    });
  }

  function buildNav(content) {
    var navMap = [
      { key: "services", href: "#services", label: "Services" },
      { key: "proof", href: "#proof", label: "What we've built" },
      { key: "testimonials", href: "#testimonials", label: "Results" },
      { key: "faq", href: "#faq", label: "FAQ" }
    ];
    var navLinks = document.getElementById("nav-links");
    navMap.forEach(function (item) {
      var section = content[item.key];
      if (section && section.visible === false) return;
      navLinks.appendChild(el("li", {}, [el("a", { href: item.href, text: item.label })]));
    });

    var navCtas = document.getElementById("nav-ctas");
    navCtas.appendChild(el("a", { class: "btn btn-ghost btn-sm", href: content.hero.secondaryCtaHref, text: content.nav.callLabel }));
    navCtas.appendChild(el("a", { class: "btn btn-primary btn-sm", href: content.hero.primaryCtaHref, id: "book", "data-open-form": "", text: content.nav.bookLabel }));
  }

  function buildHero(content) {
    var h = content.hero;
    var wrap = document.getElementById("hero-content");
    wrap.appendChild(el("span", { class: "eyebrow", text: h.eyebrow }));
    wrap.appendChild(el("h1", { text: h.headline }));
    wrap.appendChild(el("p", { class: "lede", text: h.lede }));
    var actions = el("div", { class: "hero-actions" }, [
      el("a", { class: "btn btn-primary", href: h.primaryCtaHref, "data-open-form": "", text: h.primaryCtaLabel }),
      el("a", { class: "btn btn-ghost", href: h.secondaryCtaHref, text: h.secondaryCtaLabel })
    ]);
    wrap.appendChild(actions);
  }

  function buildTrustBar(content) {
    var d = content.trustBar;
    if (!d || d.visible === false) return null;
    var grid = el("div", { class: "trust-grid" });
    d.items.forEach(function (item) {
      grid.appendChild(el("div", { class: "trust-item" }, [
        el("strong", { text: item.value }),
        el("span", { text: item.label })
      ]));
    });
    return el("div", { class: "trust-bar section-block" }, [grid]);
  }

  function buildServices(content) {
    var d = content.services;
    if (!d || d.visible === false) return null;
    var grid = el("div", { class: "services-grid" });
    d.items.forEach(function (item) {
      var ul = el("ul");
      item.bullets.forEach(function (b) { ul.appendChild(el("li", { text: b })); });
      grid.appendChild(el("article", { class: "service-card" }, [
        el("span", { class: "num", text: item.number }),
        el("h3", { text: item.title }),
        el("p", { text: item.description }),
        ul
      ]));
    });
    return el("section", { class: "services section-block", id: "services" }, [
      el("div", { class: "wrap" }, [
        el("div", { class: "section-head" }, [
          el("span", { class: "eyebrow", text: d.eyebrow }),
          el("h2", { text: d.heading }),
          el("p", { text: d.intro })
        ]),
        grid,
        d.linkHref ? el("a", { class: "section-link", href: d.linkHref, text: d.linkLabel }) : null
      ])
    ]);
  }

  function buildProof(content) {
    var d = content.proof;
    if (!d || d.visible === false) return null;
    var grid = el("div", { class: "proof-grid" });
    d.items.forEach(function (item) {
      grid.appendChild(el("a", { class: "proof-card", "data-tone": item.tone, href: item.pageHref }, [
        el("span", { class: "product-voice", text: item.name }),
        el("p", { text: item.description }),
        el("span", { class: "go", text: item.ctaLabel + " →" })
      ]));
    });
    return el("section", { class: "proof section-block", id: "proof" }, [
      el("div", { class: "wrap" }, [
        el("div", { class: "section-head" }, [
          el("span", { class: "eyebrow", text: d.eyebrow }),
          el("h2", { text: d.heading }),
          el("p", { text: d.intro })
        ]),
        grid
      ])
    ]);
  }

  function buildTestimonials(content) {
    var d = content.testimonials;
    if (!d || d.visible === false) return null;
    var grid = el("div", { class: "testi-grid" });
    d.items.forEach(function (item) {
      grid.appendChild(el("div", { class: "testi-card" }, [
        el("blockquote", { text: "“" + item.quote + "”" }),
        el("footer", { text: "— " + item.attribution + (item.sample ? " (sample)" : "") })
      ]));
    });
    var head = [
      el("span", { class: "eyebrow", text: d.eyebrow }),
      el("h2", { text: d.heading })
    ];
    if (d.items.some(function (i) { return i.sample; })) {
      head.push(el("div", {}, [el("span", { class: "sample-tag", text: d.sampleNote })]));
    }
    return el("section", { class: "testimonials section-block", id: "testimonials" }, [
      el("div", { class: "wrap" }, [
        el("div", { class: "section-head" }, head),
        grid
      ])
    ]);
  }

  function buildFaq(content) {
    var d = content.faq;
    if (!d || d.visible === false) return null;
    var list = el("div", { class: "faq-list" });
    d.items.forEach(function (item) {
      list.appendChild(el("details", { class: "faq-item" }, [
        el("summary", {}, [document.createTextNode(item.question), el("span", { class: "plus", text: "+" })]),
        el("p", { text: item.answer })
      ]));
    });
    return el("section", { class: "faq section-block", id: "faq" }, [
      el("div", { class: "wrap" }, [
        el("div", { class: "section-head" }, [
          el("span", { class: "eyebrow", text: d.eyebrow }),
          el("h2", { text: d.heading })
        ]),
        list
      ])
    ]);
  }

  function buildFinalCta(content) {
    var d = content.finalCta;
    if (!d || d.visible === false) return null;
    return el("section", { class: "final-cta section-block" }, [
      el("div", { class: "wrap" }, [
        el("div", { class: "final-cta-inner" }, [
          el("h2", { text: d.heading }),
          el("a", { class: "btn btn-ghost", href: d.href, "data-open-form": "", text: d.ctaLabel })
        ])
      ])
    ]);
  }

  function buildFooter(content) {
    var c = content.contact;
    var contact = document.getElementById("footer-contact");
    contact.appendChild(el("li", {}, [el("address", { text: c.addressLine })]));
    contact.appendChild(el("li", {}, [el("a", { href: c.phoneHref, text: c.phoneDisplay })]));
    contact.appendChild(el("li", {}, [el("a", { href: "mailto:" + c.email, text: c.email })]));

    var sister = document.getElementById("footer-sister");
    content.sisterProjects.forEach(function (item) {
      sister.appendChild(el("li", {}, [el("a", { href: item.pageHref, text: item.label })]));
    });

    var social = document.getElementById("footer-social");
    content.social.forEach(function (item) {
      social.appendChild(el("li", {}, [el("a", { href: item.href, target: "_blank", rel: "noopener", text: item.label })]));
    });
  }

  function buildMobileCta(content) {
    var h = content.hero;
    var bar = document.getElementById("mobile-cta");
    bar.appendChild(el("a", { class: "btn btn-ghost", href: h.secondaryCtaHref, text: content.nav.callLabel }));
    bar.appendChild(el("a", { class: "btn btn-primary", href: h.primaryCtaHref, "data-open-form": "", text: content.nav.bookLabel }));
  }

  fetch("./content.json", { cache: "no-store" })
    .then(function (res) { return res.json(); })
    .then(function (content) {
      buildNav(content);
      buildHero(content);

      var mount = document.getElementById("section-mount");
      [buildTrustBar, buildServices, buildProof, buildTestimonials, buildFaq, buildFinalCta]
        .map(function (fn) { return fn(content); })
        .forEach(function (node) { if (node) mount.appendChild(node); });

      buildFooter(content);
      buildMobileCta(content);
      buildLeadForm(content);
    })
    .catch(function (err) {
      document.getElementById("hero-content").innerHTML =
        '<span class="eyebrow">KashV Consultancy · Coimbatore</span>' +
        '<h1>Business &amp; IT Consulting in Coimbatore, Tamil Nadu.</h1>' +
        '<p class="lede">Trouble loading the page content — email kashvconsultant@gmail.com and we\'ll help directly.</p>';
      console.error("content.json failed to load:", err);
    });
})();
</script>
</body>
</html>
